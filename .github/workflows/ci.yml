name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run build
      - run: npm run build:browser
      - name: Verify committed build output
        run: git diff --exit-code -- dist

  dcap-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the optional DCAP peer
        run: npm install --save-dev --package-lock=false --ignore-scripts @phala/dcap-qvl@0.6.1
      - name: Verify DCAP 0.6 compatibility
        run: DCAP_COMPAT_TEST=1 npm test -- src/dcap.test.ts
