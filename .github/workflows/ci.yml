name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run build
      - run: npm run build:browser
      - name: Verify committed build output
        run: git diff --exit-code -- dist
